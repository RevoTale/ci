policies:
  - name: RevoTale CI dependencies
    config:
      - policies/dependencies/updatecli.d
    values:
      - policies/dependencies/values.yaml
    valuesinline:
      crawlers:
        woodpecker:
          filematch:
            - .woodpecker.yml
            - .woodpecker.yaml
            - .woodpecker/*.yml
            - .woodpecker/*.yaml
            - .woodpecker/**/*.yml
            - .woodpecker/**/*.yaml
            - examples/*.yaml
            - examples/dependencies/.woodpecker/*.yaml
          ignore:
            - images:
                - ghcr.io/your-org/
            - path: .woodpecker/release.yaml
              images:
                - ghcr.io/revotale/ci/
