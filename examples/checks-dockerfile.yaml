# Copy to .woodpecker/validate.yaml.
# Copy Dockerfile.checks to docker/Dockerfile.checks.
variables:
  - &check-settings
    context: .
    dockerfile: docker/Dockerfile.checks
    repo: ci-checks
    title: ${CI_REPO_NAME}
    description: Project Taskfile checks
    authors: Liakhovskyi Vladyslav
    # Replace with the project's actual license.
    licenses: MIT
    dry_run: true

when:
  - event: [pull_request, manual]
  - event: push
    branch: ${CI_REPO_DEFAULT_BRANCH}
  - event: tag
    ref: refs/tags/v*

steps:
  - name: lint
    image: ghcr.io/revotale/ci/buildx:v0.1.5@sha256:2138543fab327ee4c3250f3f7cc66d1b6185c5180f1059719506e1f4fd9932a4
    depends_on: []
    settings:
      <<: *check-settings
      target: lint

  - name: unit
    image: ghcr.io/revotale/ci/buildx:v0.1.5@sha256:2138543fab327ee4c3250f3f7cc66d1b6185c5180f1059719506e1f4fd9932a4
    depends_on: []
    settings:
      <<: *check-settings
      target: unit
