# Copy to .woodpecker/validate.yaml.
# Copy Dockerfile.checks to docker/Dockerfile.checks.
variables:
  - &check-settings
    context: .
    dockerfile: docker/Dockerfile.checks
    repo: ci-checks
    title: ${CI_REPO_NAME}
    description: Project Taskfile checks
    authors: Liakhovskyi Vladyslav
    # Replace with the project's actual license.
    licenses: MIT
    dry_run: true

when:
  - event: [pull_request, manual]
  - event: push
    branch: ${CI_REPO_DEFAULT_BRANCH}
  - event: tag
    ref: refs/tags/v*

steps:
  - name: lint
    image: ghcr.io/revotale/ci/buildx:v0.1.8@sha256:bbd7e0a849e2e87c6e1bbecc6f8caf7fae0849b84b7e6abab34af07f9b1657b9
    depends_on: []
    settings:
      <<: *check-settings
      target: lint

  - name: unit
    image: ghcr.io/revotale/ci/buildx:v0.1.8@sha256:bbd7e0a849e2e87c6e1bbecc6f8caf7fae0849b84b7e6abab34af07f9b1657b9
    depends_on: []
    settings:
      <<: *check-settings
      target: unit
