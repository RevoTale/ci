# Copy to .woodpecker.yaml; change repo and metadata for your project.
when:
  - event: [push, pull_request, manual, tag]

variables:
  - &build-settings
    context: .
    dockerfile: Dockerfile
    repo: ghcr.io/revotale/your-project
    title: ${CI_REPO_NAME}
    description: Replace with the purpose of this image
    authors: Liakhovskyi Vladyslav
    licenses: MIT

steps:
  - name: lint
    image: ghcr.io/revotale/ci/base:v0.1.0
    depends_on: []
    commands:
      - task lint

  - name: unit
    image: ghcr.io/revotale/ci/base:v0.1.0
    depends_on: []
    commands:
      - task test:unit

  # Tests the complete runtime through the Dockerfile's artifact-test target.
  - name: test-image
    image: ghcr.io/revotale/ci/buildx:v0.1.0
    depends_on: [lint, unit]
    settings:
      <<: *build-settings
      target: artifact-test
      platforms: linux/arm64
      dry_run: true
      cache_to: type=local,dest=.build-cache,mode=max

  # Reuses matching runtime layers from test-image; test layers are not published.
  - name: build-image
    image: ghcr.io/revotale/ci/buildx:v0.1.0
    depends_on: [test-image]
    when:
      - event: [push, pull_request, manual]
    settings:
      <<: *build-settings
      target: release
      platforms: linux/arm64,linux/amd64
      dry_run: true
      cache_from: 'type=local\,src=.build-cache'

  - name: publish-image
    image: ghcr.io/revotale/ci/buildx:v0.1.0
    depends_on: [test-image]
    when:
      - event: tag
        ref: refs/tags/v*
    settings:
      <<: *build-settings
      target: release
      platforms: linux/arm64,linux/amd64
      cache_from: 'type=local\,src=.build-cache'
      registry: ghcr.io
      tags: ${CI_COMMIT_TAG}
      username:
        from_secret: registry_username
      password:
        from_secret: registry_password
