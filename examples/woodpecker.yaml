# Choose this workflow for Docker images.
# It already includes lint and unit tests.
variables:
  - &pr-and-manual
    event: [pull_request, manual]

  - &default-branch-push
    event: push
    branch: ${CI_REPO_DEFAULT_BRANCH}

  - &release-tag
    event: tag
    ref: refs/tags/v*

  - &build-settings
    context: .
    dockerfile: Dockerfile
    repo: ghcr.io/revotale/your-project
    title: ${CI_REPO_NAME}
    description: Replace with the purpose of this image
    authors: Liakhovskyi Vladyslav
    licenses: MIT

when:
  - *pr-and-manual
  - *default-branch-push
  - *release-tag

steps:
  - name: lint
    image: ghcr.io/revotale/ci/base:v0.1.0
    depends_on: []
    commands:
      - task lint

  - name: unit
    image: ghcr.io/revotale/ci/base:v0.1.0
    depends_on: []
    commands:
      - task test:unit

  # Tests the complete runtime through the Dockerfile's artifact-test target.
  - name: test-image
    image: ghcr.io/revotale/ci/buildx:v0.1.0
    depends_on: [lint, unit]
    settings:
      <<: *build-settings
      target: artifact-test
      # Omit platforms to test on the builder's native platform.
      dry_run: true
      cache_to: type=local,dest=.build-cache,mode=max

  # Reuses matching runtime layers from test-image; test layers are not published.
  - name: build-image
    image: ghcr.io/revotale/ci/buildx:v0.1.0
    depends_on: [test-image]
    when:
      - *pr-and-manual
      - *default-branch-push
    settings:
      <<: *build-settings
      target: release
      # PR, push and manual checks build only the native platform.
      dry_run: true
      cache_from: 'type=local\,src=.build-cache'

  - name: publish-image
    image: ghcr.io/revotale/ci/buildx:v0.1.0
    depends_on: [test-image]
    when:
      - *release-tag
    settings:
      <<: *build-settings
      target: release
      platforms: linux/arm64,linux/amd64
      cache_from: 'type=local\,src=.build-cache'
      registry: ghcr.io
      tags: ${CI_COMMIT_TAG}
      username:
        from_secret: registry_username
      password:
        from_secret: registry_password
