when:
  - event: cron
    cron: dependencies
    branch: ${CI_REPO_DEFAULT_BRANCH}
  - event: manual
    branch: ${CI_REPO_DEFAULT_BRANCH}

steps:
  - name: update-dependencies
    image: ghcr.io/revotale/ci/updatecli:v0.1.3
    environment:
      # Public repositories also need authentication to push branches and open PRs.
      UPDATECLI_GITHUB_TOKEN:
        from_secret: forge_token
    commands:
      - updatecli compose apply
