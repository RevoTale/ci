# Choose this workflow for file artifacts.
# It already includes lint and unit tests.
# Use project-specific images when Go and Task are not enough.
variables:
  - &pr-and-manual
    event: [pull_request, manual]

  - &default-branch-push
    event: push
    branch: ${CI_REPO_DEFAULT_BRANCH}

  - &release-tag
    event: tag
    ref: refs/tags/v*

when:
  - *pr-and-manual
  - *default-branch-push
  - *release-tag

steps:
  - name: lint
    image: ghcr.io/revotale/ci/base:v0.1.3
    depends_on: []
    commands: [task lint]

  - name: unit
    image: ghcr.io/revotale/ci/base:v0.1.3
    depends_on: []
    commands: [task test:unit]

  # Write artifacts into the shared workspace, for example dist/.
  - name: build
    image: ghcr.io/revotale/ci/base:v0.1.3
    depends_on: [lint, unit]
    commands: [task build]

  # Check the built files without rebuilding them.
  - name: artifact
    image: ghcr.io/revotale/ci/base:v0.1.3
    depends_on: [build]
    commands: [task test:artifact]

  # Upload the tested files; do not rebuild them.
  # Add destination-specific secrets here, available only to tag events.
  - name: publish
    image: ghcr.io/revotale/ci/base:v0.1.3
    depends_on: [artifact]
    when:
      - *release-tag
    commands: [task publish]
