version: "3"

tasks:
  lint:
    desc: Check Go code and formatting
    cmds:
      - go tool golangci-lint run --build-tags=integration

  test:unit:
    desc: Run Go unit tests
    cmds:
      - go test ./...

  test:integration:
    desc: Verify metadata in the image built by the released wrapper
    env:
      CI_SMOKE_IMAGE: "{{.ROOT_DIR}}/.smoke-image"
    cmds:
      - go test -tags=integration -count=1 ./tests/consumer

  fmt:
    desc: Format Go code
    env:
      GOFLAGS: -tags=integration
    cmds:
      # go fmt omits the build-tagged test-only package from ./... discovery.
      - go fmt ./... ./tests/consumer

  fix:
    desc: Apply Go modernization fixes
    cmds:
      - go fix -tags=integration ./...
