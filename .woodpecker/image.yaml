depends_on: [validate]

matrix:
  include:
    - BUILD_CONTEXT: .
      DOCKERFILE: images/buildx/Dockerfile
      IMAGE_REPOSITORY: ghcr.io/revotale/ci/buildx
      IMAGE_DESCRIPTION: Docker Buildx plugin with required RevoTale metadata
    - BUILD_CONTEXT: images/go-task
      DOCKERFILE: images/go-task/Dockerfile
      IMAGE_REPOSITORY: ghcr.io/revotale/ci/base
      IMAGE_DESCRIPTION: Go and Task on Debian Trixie
    - BUILD_CONTEXT: images/updatecli
      DOCKERFILE: images/updatecli/Dockerfile
      IMAGE_REPOSITORY: ghcr.io/revotale/ci/updatecli
      IMAGE_DESCRIPTION: Updatecli with Go for dependency pull requests

variables:
  - &pr-and-manual
    event: [pull_request, manual]

  - &default-branch-push
    event: push
    branch: ${CI_REPO_DEFAULT_BRANCH}

  - &release-tag
    event: tag
    ref: refs/tags/v*

  - &build-settings
    context: ${BUILD_CONTEXT}
    dockerfile: ${DOCKERFILE}
    labels:
      - org.opencontainers.image.title=${CI_REPO_NAME}
      - org.opencontainers.image.description=${IMAGE_DESCRIPTION}
      - org.opencontainers.image.authors=Liakhovskyi Vladyslav
      - org.opencontainers.image.licenses=MIT

when:
  - *pr-and-manual
  - *default-branch-push
  - *release-tag

steps:
  - name: test-image
    image: woodpeckerci/plugin-docker-buildx:6.1.2@sha256:d26b69cbe748b8a219c707e7889d5ffb3f9214bc3c480c30fe857ff85954267c
    settings:
      <<: *build-settings
      target: artifact-test
      # Omit platforms to test on the builder's native platform.
      dry_run: true
      cache_to: type=local,dest=.build-cache,mode=max

  - name: build-image
    image: woodpeckerci/plugin-docker-buildx:6.1.2@sha256:d26b69cbe748b8a219c707e7889d5ffb3f9214bc3c480c30fe857ff85954267c
    depends_on: [test-image]
    when:
      - *pr-and-manual
      - *default-branch-push
    settings:
      <<: *build-settings
      target: release
      # PR, push and manual checks build only the native platform.
      dry_run: true
      cache_from: 'type=local\,src=.build-cache'

  - name: publish-image
    image: woodpeckerci/plugin-docker-buildx:6.1.2@sha256:d26b69cbe748b8a219c707e7889d5ffb3f9214bc3c480c30fe857ff85954267c
    depends_on: [test-image]
    when:
      - *release-tag
    settings:
      <<: *build-settings
      target: release
      platforms: linux/arm64,linux/amd64
      cache_from: 'type=local\,src=.build-cache'
      registry: ghcr.io
      repo: ${IMAGE_REPOSITORY}
      tags: "${CI_COMMIT_TAG}"
      username:
        from_secret: registry_username
      password:
        from_secret: registry_password
