when:
  - event: [push, pull_request, manual, tag]

depends_on: [validate]

steps:
  - name: test-image
    image: woodpeckerci/plugin-docker-buildx:6.1.1
    settings:
      context: images/go-task
      dockerfile: images/go-task/Dockerfile
      target: artifact-test
      # Test arm64 by default; add other platforms when needed.
      platforms: linux/arm64
      dry_run: true
      cache_to: type=local,dest=.build-cache,mode=max

  - name: build-image
    image: woodpeckerci/plugin-docker-buildx:6.1.1
    depends_on: [test-image]
    when:
      - event: [push, pull_request, manual]
    settings:
      context: images/go-task
      dockerfile: images/go-task/Dockerfile
      target: release
      platforms: linux/amd64,linux/arm64
      dry_run: true
      # Reuse matching runtime layers through this workflow's shared workspace.
      cache_from: 'type=local\,src=.build-cache'

  - name: publish-image
    image: woodpeckerci/plugin-docker-buildx:6.1.1
    depends_on: [test-image]
    when:
      - event: tag
        ref: refs/tags/v*
    settings:
      context: images/go-task
      dockerfile: images/go-task/Dockerfile
      target: release
      platforms: linux/amd64,linux/arm64
      cache_from: 'type=local\,src=.build-cache'
      # Publish versioned images only after artifact checks pass.
      registry: ghcr.io
      repo: ghcr.io/revotale/ci/go-task
      tags: ${CI_COMMIT_TAG}
      username:
        from_secret: registry_username
      password:
        from_secret: registry_password
