when:
  - event: push
    branch: ${CI_REPO_DEFAULT_BRANCH}

depends_on: [image]

steps:
  - name: prepare-release
    image: woodpeckerci/plugin-ready-release-go:4.1.2@sha256:42239ea8a6dd4981b1bcee93431050d4524e942d26ba2b14ec5112a708306143
    environment:
      PLUGIN_GIT_EMAIL: ${CI_COMMIT_AUTHOR_EMAIL}
      PLUGIN_FORGE_TOKEN:
        from_secret: forge_token
    commands:
      # Upstream 4.1.2 copies x86 esbuild into ARM64 images. Repair its pinned
      # dependency before starting the official plugin; remove when upstream fixes it.
      - npm rebuild --prefix /app --foreground-scripts esbuild
      - /app/node_modules/.bin/tsx /app/src/run.ts
