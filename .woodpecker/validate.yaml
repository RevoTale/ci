when:
  # Check working branches through PRs; validate the merged default branch separately.
  - event: [pull_request, manual]
  # Tags are a separate pipeline, so release validation must not be skipped.
  - event: tag
    ref: refs/tags/v*
  - event: push
    branch: ${CI_REPO_DEFAULT_BRANCH}

steps:
  - name: validate-workflows
    image: woodpeckerci/woodpecker-cli:v3.19.0-alpine
    depends_on: []
    commands:
      # CLI lint does not read the server's privileged-plugin allowlist.
      # This declaration grants no runtime privileges.
      - >-
        woodpecker-cli --disable-update-check lint --strict
        --plugins-privileged=woodpeckerci/plugin-docker-buildx:6.1.2
      - >-
        woodpecker-cli --disable-update-check lint --strict
        --plugins-privileged=ghcr.io/revotale/ci/buildx:v0.1.0
        examples/woodpecker.yaml
      - >-
        woodpecker-cli --disable-update-check lint --strict
        examples/dependencies/.woodpecker/dependencies.yaml

  - name: check-format-and-fixes
    image: golang:1.27.2-trixie
    depends_on: []
    commands:
      - go tool task fmt
      - go tool task fix
      # CI starts from a clean checkout; required updates must fail the check.
      - git diff --exit-code -- '*.go'

  - name: lint
    image: golang:1.27.2-trixie
    depends_on: [check-format-and-fixes]
    commands:
      - go tool task lint

  - name: unit
    image: golang:1.27.2-trixie
    depends_on: [check-format-and-fixes]
    commands:
      - go tool task test:unit

  - name: validate-dependency-policy
    image: ghcr.io/updatecli/updatecli:v0.123.0
    depends_on: []
    commands:
      # Parse the shared policy without pushing branches or creating PRs.
      - >-
        updatecli --disable-version-check manifest validate --strict
        --config policies/dependencies/updatecli.d
        --values policies/dependencies/values.yaml
