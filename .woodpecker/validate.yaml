when:
  # Check working branches through PRs; validate the merged default branch separately.
  - event: [pull_request, manual]
  # Tags are a separate pipeline, so release validation must not be skipped.
  - event: tag
    ref: refs/tags/v*
  - event: push
    branch: ${CI_REPO_DEFAULT_BRANCH}

steps:
  - name: validate-workflows
    image: woodpeckerci/woodpecker-cli:v3.19.0-alpine@sha256:27a77117e38d7bbdc380f0e90ff3ee4871ab1eefa78b5d9136a2c969fbecd9f4
    depends_on: []
    commands:
      # CLI lint does not read the server's privileged-plugin allowlist.
      # This declaration grants no runtime privileges.
      - >-
        woodpecker-cli --disable-update-check lint --strict
        --plugins-privileged=woodpeckerci/plugin-docker-buildx
      - >-
        woodpecker-cli --disable-update-check lint --strict
        --plugins-privileged=ghcr.io/revotale/ci/buildx
        examples/woodpecker.yaml
      - >-
        woodpecker-cli --disable-update-check lint --strict
        examples/task-workflow.yaml
      - >-
        woodpecker-cli --disable-update-check lint --strict
        examples/checks-services.yaml
      - >-
        woodpecker-cli --disable-update-check lint --strict
        --plugins-privileged=ghcr.io/revotale/ci/buildx
        examples/checks-dockerfile.yaml

  # Bootstrap with released tools; artifact tests build the next toolchain.
  - name: check-format-and-fixes
    image: ghcr.io/revotale/ci/base:v0.1.5@sha256:6e63627e23192f3e6258776bc9eeca0cc42829b1c447bc252ece997541e73f09
    depends_on: []
    commands:
      - task fmt
      - task fix
      # CI starts from a clean checkout; required updates must fail the check.
      - git diff --exit-code -- '*.go'

  - name: lint
    image: ghcr.io/revotale/ci/base:v0.1.5@sha256:6e63627e23192f3e6258776bc9eeca0cc42829b1c447bc252ece997541e73f09
    depends_on: [check-format-and-fixes]
    commands:
      - task lint

  - name: unit
    image: ghcr.io/revotale/ci/base:v0.1.5@sha256:6e63627e23192f3e6258776bc9eeca0cc42829b1c447bc252ece997541e73f09
    depends_on: [check-format-and-fixes]
    commands:
      - task test:unit
