when:
  - event: pull_request

matrix:
  include:
    - SMOKE_BUILDX: ghcr.io/revotale/ci/buildx:v0.1.8
    - SMOKE_BUILDX: ghcr.io/revotale/ci/buildx:v0.1.8@sha256:bbd7e0a849e2e87c6e1bbecc6f8caf7fae0849b84b7e6abab34af07f9b1657b9
    - SMOKE_BUILDX: woodpeckerci/plugin-docker-buildx:6.1.2@sha256:d26b69cbe748b8a219c707e7889d5ffb3f9214bc3c480c30fe857ff85954267c

steps:

  # Exercise this release through the normal consumer plugin interface.
  - name: build-consumer
    image: "${SMOKE_BUILDX}"
    pull: true
    depends_on: []
    settings:
      debug: true
      context: tests/consumer
      dockerfile: tests/consumer/Dockerfile
      repo: ci-smoke
      title: CI smoke
      description: Buildx smoke test, native platform
      authors: Liakhovskyi Vladyslav
      licenses: MIT
      labels:
        - org.opencontainers.image.title=CI smoke
        - org.opencontainers.image.description=Buildx smoke test\, native platform
        - org.opencontainers.image.authors=Liakhovskyi Vladyslav
        - org.opencontainers.image.licenses=MIT
        - com.revotale.smoke=preserved
      dry_run: true
      output: type=oci,tar=false,dest=.smoke-image

  # Inspect exported metadata without loading an image or publishing a fixture.
  - name: inspect-consumer
    image: "ghcr.io/revotale/ci/base:v0.1.8@sha256:c59b01e74acd309c9c775f594917df6d9f8cad93fdfa7f40408aebeb5140f414"
    pull: true
    depends_on: [build-consumer]
    environment:
      CI_SMOKE_IMAGE: ${CI_WORKSPACE}/.smoke-image
    commands:
      - go test -tags=integration -count=1 -run '^TestPublishedWrapperLabels$' ./tests/consumer
